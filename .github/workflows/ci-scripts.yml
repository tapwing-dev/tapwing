name: CI - Release scripts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable (for cargo tree in dist.sh)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Test dist.sh and install.sh
        run: scripts/test-dist.sh
