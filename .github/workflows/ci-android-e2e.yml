name: CI - Android emulator E2E

# The one workflow that runs the CLI, the in-app Dart driver and the native driver APK
# together on a device: `scripts/ci-android-e2e.sh` builds all three and runs the sample
# app's Android flows on an API 35 x86_64 emulator. The script documents which flows run
# and what each run must exit with.
#
# Not required yet. This workflow is separate from `ci.yml` and is not in the `CI Gate`
# needs list, so a red run does not block a merge. Make it required after a week of
# stable runs on `main` (issue #3). A required check must report on every pull request,
# and this workflow is skipped when a pull request touches none of the paths below. So
# to require it, call it from `ci.yml` (add `workflow_call` here) behind a job that
# detects changed paths, and let `CI Gate` accept "skipped" for this one job.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/**'
      - 'drivers/android/**'
      - 'examples/sample_app/**'
      - 'scripts/ci-android-e2e.sh'
      - 'scripts/build-android-driver.sh'
      - '.github/workflows/ci-android-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: API 35 x86_64
    runs-on: ubuntu-latest
    # Backstop only. Every step below has its own limit, and the script limits each
    # build and each `tapwing test` call and names the one that ran out of time.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 5

      # Hosted Linux runners have KVM, but the runner user may not open /dev/kvm. Without
      # it the emulator falls back to software emulation and does not boot in time.
      - name: Enable KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm is not readable and writable by the runner user: no hardware acceleration for the emulator"
            exit 1
          fi

      - name: Install protoc
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Setup Rust stable
        timeout-minutes: 10
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 10
        with:
          workspaces: crates/tapwing

      - name: Setup JDK 17
        timeout-minutes: 5
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        timeout-minutes: 5
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # 3.47.5 is the primary Flutter baseline of `ci-dart.yml`. The sample app does not
      # build for Android on 3.50.0 yet (its Android Gradle Plugin 9.1.0 is below that
      # Flutter's minimum, see issue #3).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        timeout-minutes: 10
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      # The driver APK compiles against platform 37, as in `ci-android-driver.yml`.
      - name: Install Android SDK platform 37
        timeout-minutes: 10
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT not found on runner" >&2
            exit 1
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1 || true)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" || "$SDKMANAGER" "platforms;android-37"

      # Built before the emulator boots, so the builds and the emulator do not share
      # the runner's CPU and memory. The script limits each of the three builds.
      - name: Build the CLI, the driver APK and the sample app
        timeout-minutes: 70
        run: scripts/ci-android-e2e.sh --build-only --abi x86_64

      # `pixel_6_pro` is 1440x3120 at 560 dpi, the device the reference screenshots were
      # recorded on. The script sets the density to 560 itself if the AVD differs.
      # Animations stay on, as on a developer's device: flows such as
      # f2_endless_animation test how the driver settles while the app animates.
      # The step limit covers the boot (600 s) and every run limit in the script.
      - name: Run the flows on the emulator
        timeout-minutes: 75
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6_pro
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-port: 5554
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: scripts/ci-android-e2e.sh --skip-build --serial emulator-5554 --out build/android-e2e

      # Per run: trace.html and trace.json, junit.xml, report.json, failure screenshots.
      # Plus summary.md, device.txt and logcat.txt of the whole run.
      - name: Upload traces, reports and logcat
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/android-e2e/
          if-no-files-found: warn
          retention-days: 14
