name: CI - Android driver

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: drivers/android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT not found on runner" >&2
            exit 1
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1 || true)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" || "$SDKMANAGER" "platforms;android-37"

      # `:driver:test` (Kotlin unit tests) + `:driver:assembleRelease`, then the APK and its SHA-256.
      - name: Test and build the Android driver
        run: scripts/build-android-driver.sh
