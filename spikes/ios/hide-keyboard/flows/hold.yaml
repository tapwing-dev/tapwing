# Bring the app into "text field focused + typed" state, then keep the
# Maestro XCTest runner alive so we can talk to it directly over HTTP.
appId: dev.tapwing.sampleApp
---
- launchApp: {clearState: true}
- tapOn: "Email"
- inputText: "a@b.c"
- extendedWaitUntil:
    visible: "THIS_TEXT_NEVER_APPEARS"
    timeout: 900000
    optional: true
