# User repro (first 4 steps) + evidence. Asserts only that Flutter sees no
# soft-keyboard inset; Flutter focus state is taken from the app log (KBDBG).
appId: dev.tapwing.sampleApp
---
- launchApp: {clearState: true}
- tapOn: "Email"
- inputText: "a@b.c"
- hideKeyboard
- takeScreenshot: after_hideKeyboard
- assertVisible:
    id: "kb_debug"
    text: ".*inset=0"
