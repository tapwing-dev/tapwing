# Flow-level workaround (stock Maestro, unchanged app): press the return key
# instead of hideKeyboard. Side effect: fires the field's onSubmitted/onEditingComplete.
appId: dev.tapwing.sampleApp
---
- launchApp: {clearState: true}
- tapOn: "Email"
- inputText: "a@b.c"
- pressKey: Enter
- hideKeyboard
- takeScreenshot: after_enter
- assertVisible:
    id: "kb_debug"
    text: ".*focus=none inset=0"
