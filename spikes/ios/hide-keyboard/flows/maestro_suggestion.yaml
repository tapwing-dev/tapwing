# Maestro's own suggestion from the HideKeyboardFailure message: tap a static text.
appId: dev.tapwing.sampleApp
---
- launchApp: {clearState: true}
- tapOn: "Email"
- inputText: "a@b.c"
- tapOn: "Welcome back"
- takeScreenshot: after_tap_static_text
- assertVisible:
    id: "kb_debug"
    text: ".*focus=none inset=0"
