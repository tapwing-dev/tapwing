# Exact user repro (first 4 steps) + post-condition evidence from the app's
# diagnostics overlay (Flutter focus + keyboard inset as seen by the app).
appId: dev.tapwing.sampleApp
---
- launchApp: {clearState: true}
- tapOn: "Email"
- inputText: "a@b.c"
- hideKeyboard
- takeScreenshot: after_hideKeyboard
- assertVisible:
    id: "kb_debug"
    text: ".*focus=none inset=0"
