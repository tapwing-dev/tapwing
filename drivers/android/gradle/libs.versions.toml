[versions]
agp = "9.5.2"
protobufPlugin = "0.10.1"
protobuf = "4.36.2"
grpc = "1.85.1"
# Same UiAutomator as Maestro 2.12.1: `getWindowRoots` (window order),
# `clickNoSync` (tap length) and `waitForWindowUpdate` come from it verbatim.
uiautomator = "2.3.0"
androidxTestMonitor = "1.8.0"
gmsLocation = "21.3.0"
javaxAnnotation = "1.3.2"
junit = "4.13.2"

[libraries]
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-protobuf-lite = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-monitor = { module = "androidx.test:monitor", version.ref = "androidxTestMonitor" }
gms-location = { module = "com.google.android.gms:play-services-location", version.ref = "gmsLocation" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version.ref = "javaxAnnotation" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
