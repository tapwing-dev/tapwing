[package]
name = "tapwing"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
fancy-regex = "0.20.2"
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
prost = "0.14.6"
quick-xml = "0.42.0"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "time", "net", "sync"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.9"
tower-service = "0.3.3"
ureq = "3.5.2"
yaml-rust2 = "0.13.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
socket2 = "0.6.5"
tonic = { version = "0.14.9", default-features = false, features = ["server", "router", "codegen"] }

[build-dependencies]
tonic-prost-build = "0.14.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
