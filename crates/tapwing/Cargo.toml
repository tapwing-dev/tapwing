[package]
name = "tapwing"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
fancy-regex = "0.20.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
prost = "0.14.6"
quick-xml = "0.42.0"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "sync"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
ureq = "3.5.2"
yaml-rust2 = "0.13.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[build-dependencies]
tonic-prost-build = "0.14.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
