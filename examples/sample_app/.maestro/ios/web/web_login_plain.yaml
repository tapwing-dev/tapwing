# Browser login through an ASWebAuthenticationSession, `plain` page:
# email and password on one page.
# Needs bench/web-login/server.py on the Mac's 127.0.0.1:8765, which the
# simulator shares; bench/web-login/run_bench.sh starts it.
# Kept out of the top level on purpose: a workspace run of `.maestro/` has no
# server, while `tapwing check` still validates sub-folders.
#   tapwing test .maestro/ios/web/web_login_plain.yaml
appId: dev.tapwing.sampleApp
name: Web login (plain)
tags:
  - web-login
---
- launchApp:
    clearState: true
- tapOn:
    id: "browser_login_button"
- tapOn:
    id: "browser_login_plain"
# SpringBoard asks whether the app may use the site to sign in. The labels are
# localised, "Continue" is the English one.
- tapOn: "Continue"
# The Safari view (com.apple.SafariViewService) is on top from here to the submit button.
- assertVisible: "Tapwing Bench sign-in"
- tapOn: "Email address"
- inputText: "qa.pilot@tapwing.dev"
- tapOn: "Password"
- inputText: "Tw!ng-Pass2026"
- tapOn: "Sign in"
# The page redirects to tapwingsample://callback and the app is back on top.
- assertVisible: "Signed in as qa.pilot@tapwing.dev"
