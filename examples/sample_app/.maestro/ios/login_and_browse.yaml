appId: dev.tapwing.sampleApp
name: Login and browse (iOS)
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn: "Log in"
- assertVisible: "Email is required"
- tapOn: "Email"
- inputText: "jan@example.com"
- tapOn:
    id: "password_input"
- inputText: "secret123"
- hideKeyboard
- tapOn:
    id: "login_button"
- assertVisible: "Products"
- assertVisible: "Product 1.*"
- scrollUntilVisible:
    element: "Product 40.*"
- tapOn: "Product 40.*"
- assertVisible: "Details of Product 40"
- tapOn:
    id: "favorite_switch"
- assertVisible:
    text: "Favorite"
    checked: true
# iOS: `back` is a no-op in Maestro (IOSDriver.backPress), the screen stays.
- back
- assertVisible: "Details of Product 40"
- tapOn: "Back"
- assertVisible: "Products"
- tapOn: "Add product"
- assertVisible: "New product"
- tapOn: "Name"
- inputText: "Tapwing"
- tapOn: "Add"
- assertVisible: "Added Tapwing"
- assertNotVisible: "New product"
