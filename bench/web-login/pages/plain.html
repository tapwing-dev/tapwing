<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapwing Bench sign-in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<h1>Tapwing Bench sign-in</h1>
{{error_block}}
<form method="post" action="/plain/login">
<input type="hidden" name="redirect_uri" value="{{redirect_uri}}">
<input type="hidden" name="state" value="{{state}}">
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
</main>
</body>
</html>
